name: Java CI-CD with Gradle

on:
  push:
    tags:
      - '*'

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: "Pull & Checkout"
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: "Set up JDK 25"
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'gradle'
      - name: "Config Git"
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "actions"
      - name: "Apply Patches"
        run: |
          chmod +x ./gradlew
          ./gradlew applyAllPatches
      - name: "Build & Package"
        run: ./gradlew createPaperclipJar
      - name: "Copy jar to staging"
        run: mkdir staging && cp DeerFolia-server/build/libs/DeerFolia-paperclip-*.jar staging/
      - name: "Rename file to DeerFolia-{git tag name}.jar"
        run: |
          GIT_TAG=$(git describe --tags --abbrev=0)
          ls staging
          mv staging/*.jar staging/DeerFolia-$GIT_TAG.jar
          ls staging
      - uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "${{ steps.build.outputs.GIT_TAG }}"
          prerelease: false
          files: |
            staging/*.jar